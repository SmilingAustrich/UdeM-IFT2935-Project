services:
  db:
    image: postgres:15
    container_name: db_hopital
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hopital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: backend_hopital
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hopital
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    container_name: frontend_hopital
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
